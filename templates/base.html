<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ title }} — {{ site.name }}{% endblock %}</title>
{% if description %}<meta name="description" content="{{ description }}">{% endif %}
<meta name="color-scheme" content="dark">
<link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body id="top">
<nav class="site-nav" aria-label="Main">
  <div class="wrap">
    <a class="brand" href="{{ url_for('home') }}"><span class="glitch" data-text="{{ site.name }}">{{ site.name }}</span></a>
    <button class="menu-toggle" aria-expanded="false" aria-controls="nav-links"
      onclick="this.setAttribute('aria-expanded', this.closest('nav').classList.toggle('open'))">Menu</button>
    <ul id="nav-links">
      {% for endpoint, label in nav %}
      <li><a href="{{ url_for(endpoint) }}"{% if endpoint == page %} aria-current="page"{% endif %}>{{ label }}</a></li>
      {% endfor %}
      <li><a href="{{ url_for('account') }}"{% if page == 'account' %} aria-current="page"{% endif %}>{{ account or "Log in" }}</a></li>
    </ul>
  </div>
</nav>

<main class="wrap">
  <header class="hero">
    <h1>{{ title }}</h1>
    <p class="tag">{{ subtitle }}</p>
  </header>
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>© {{ year }} {{ site.name }}</span>
    <a href="#top">Back to top</a>
  </div>
</footer>
</body>
</html>
