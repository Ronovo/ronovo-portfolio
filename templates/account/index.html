{% extends "base.html" %}
{% set title = "Account" %}
{% block content %}
  <form class="form" method="post" action="{{ url_for('logout') }}">
    <p>Logged in as <strong>{{ account }}</strong>.</p>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button>Log out</button>
  </form>
{% endblock %}
