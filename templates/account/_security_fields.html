    <label>Security question
      <select name="question" required>
        <option value="">Pick a question</option>
        {% for q in questions %}<option{% if q == question %} selected{% endif %}>{{ q }}</option>{% endfor %}
      </select>
    </label>
    <label>Answer <input name="answer" maxlength="{{ MAX_ANSWER_LENGTH }}" autocomplete="off" required></label>
    <p>You need this answer to reset your password.</p>
