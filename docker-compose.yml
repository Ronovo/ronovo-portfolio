name: ronovo-portfolio

# Portfolio login: where each app sends players to log in, and the key it checks their login token with.
x-portfolio-sso: &portfolio-sso
  PORTFOLIO_SSO_URL: ${PORTFOLIO_SSO_URL:?set PORTFOLIO_SSO_URL in .env}
  PORTFOLIO_SSO_PUBLIC_KEY: ${PORTFOLIO_SSO_PUBLIC_KEY:?set PORTFOLIO_SSO_PUBLIC_KEY in .env}

services:
  portfolio:
    build: https://github.com/Ronovo/ronovo-portfolio.git#main
    ports:
      - "127.0.0.1:4482:8000"
    environment:
      PORTFOLIO_SECRET_KEY: ${PORTFOLIO_SECRET_KEY:?set PORTFOLIO_SECRET_KEY in .env}
      PORTFOLIO_SSO_PRIVATE_KEY: ${PORTFOLIO_SSO_PRIVATE_KEY:?set PORTFOLIO_SSO_PRIVATE_KEY in .env}
    volumes:
      - portfolio-data:/app/data
    restart: unless-stopped

  gm-toolbox:
    build: https://github.com/Ronovo/Gamemaster-Toolbox.git#main
    ports:
      - "9000:8080"
    environment: *portfolio-sso
    volumes:
      - gmtoolbox-data:/app/App_Data
    restart: unless-stopped

  osrs-tracker:
    build: https://github.com/Ronovo/Personal-RuneScape-Tracker.git#main
    ports:
      - "4123:4123"
    environment:
      <<: *portfolio-sso
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    volumes:
      - osrs-tracker-data:/app/data
    restart: unless-stopped

  casino:
    build: https://github.com/Ronovo/Casino_Test.git#main
    ports:
      - "8002:8000"
    environment: *portfolio-sso
    volumes:
      - casino-data:/app/data
    restart: unless-stopped

  space-online:
    build: https://github.com/Ronovo/online-space-staion.git#main
    ports:
      - "8003:5000"
    # Its own cookie name, so it does not clash with gunsystem's Flask "session" cookie on the same host.
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "1", "--threads", "8",
              "space_online.webapp:create_app({'SESSION_COOKIE_NAME': 'space_online_session'})"]
    environment:
      <<: *portfolio-sso
      SPACE_ONLINE_SECRET_KEY: ${SPACE_ONLINE_SECRET_KEY:?set SPACE_ONLINE_SECRET_KEY in .env}
    volumes:
      - space-online-data:/app/instance
    restart: unless-stopped

  esoteric-chat:
    build: https://github.com/Ronovo/esoteric-chat.git#main
    ports:
      - "8004:5000"
    environment:
      <<: *portfolio-sso
      ESOTERIC_CHAT_SECRET_KEY: ${ESOTERIC_CHAT_SECRET_KEY:?set ESOTERIC_CHAT_SECRET_KEY in .env}
    restart: unless-stopped

  gunsystem:
    build: https://github.com/Ronovo/standalonegunsystem.git#main
    ports:
      - "8000:8000"
    environment:
      <<: *portfolio-sso
      GUNSYSTEM_SECRET_KEY: ${GUNSYSTEM_SECRET_KEY:?set GUNSYSTEM_SECRET_KEY in .env}
    volumes:
      - gunsystem-data:/app/data
    restart: unless-stopped

  dead-but-dreaming:
    build: https://github.com/Ronovo/Dead-But-Dreaming.git#main
    ports:
      - "8005:8000"
    environment:
      <<: *portfolio-sso
      DEAD_BUT_DREAMING_SECRET_KEY: ${DEAD_BUT_DREAMING_SECRET_KEY:?set DEAD_BUT_DREAMING_SECRET_KEY in .env}
    volumes:
      - dead-but-dreaming-data:/app/data
    restart: unless-stopped

volumes:
  portfolio-data:
  space-online-data:
  gmtoolbox-data:
  osrs-tracker-data:
  casino-data:
  dead-but-dreaming-data:
  gunsystem-data:
